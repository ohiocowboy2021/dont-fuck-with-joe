<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Throw stuff at Joe's head. Just don't." />
  <title>Don't Fuck With Joe</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="ui">
    <div id="scoreboard" aria-live="polite">
      <div>Score: <span id="score">0</span></div>
      <div>High: <span id="highscore">0</span></div>
      <div>Hits: <span id="hits">0</span></div>
      <div>Level: <span id="level">1</span></div>
      <button id="new-round-btn" type="button" aria-label="Start a new round">NEW ROUND</button>
    </div>

    <div id="start-screen" class="overlay">
      <h1>Don't Fuck With Joe</h1>
      <img src="assets/joe.jpg" alt="Joe" class="title-joe" />
      <div id="title-joe-fallback" class="title-joe-fallback hidden" aria-hidden="true">JOE</div>
      <p class="subtitle">Throw footballs, golf balls &amp; mics at his head</p>
      <ul class="instructions">
        <li><strong>Tap / click</strong> = quick throw</li>
        <li><strong>Tap / click + drag</strong> = aim &amp; power</li>
        <li>Hit him 3 times → Janette appears</li>
        <li>Difficulty ramps up as you score</li>
      </ul>
      <button id="start-btn" type="button">START THROWING</button>
      <p class="credit">Made for Joe (and Janette)</p>
    </div>

    <div id="janette-popup" class="hidden" aria-live="assertive">
      <img src="assets/janette.jpg" alt="Janette" id="janette-img" />
      <div id="janette-fallback" class="janette-fallback hidden" aria-hidden="true">JANETTE</div>
      <div class="janette-text">JOEEEEEEE!</div>
    </div>

    <div id="message" class="hidden" aria-live="polite"></div>
  </div>

  <canvas id="game" aria-label="Don't Fuck With Joe game area"></canvas>

  <!-- Optional file sources may be added later; synthesized effects are used by default. -->
  <audio id="sfx-hit" preload="auto"></audio>
  <audio id="sfx-janette" preload="auto"></audio>
  <audio id="sfx-throw" preload="auto"></audio>

  <script src="js/game.js"></script>
</body>
</html>
